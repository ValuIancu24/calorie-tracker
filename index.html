<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#16a34a" />
    <title>Calorie Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-top">
        <h1 id="header-title">Astăzi</h1>
        <span id="header-date" class="header-date"></span>
      </div>
      <nav class="tabbar">
        <button class="tab active" data-view="home">🏠 Acasă</button>
        <button class="tab" data-view="stats">📊 Statistici</button>
      </nav>
    </header>

    <main>
      <!-- ============ ACASĂ ============ -->
      <section id="view-home" class="view active">
        <div class="upload-card">
          <label for="photo-input" class="upload-btn">📷 Adaugă o poză cu mâncare</label>
          <input id="photo-input" type="file" accept="image/*" hidden />
          <p class="hint">
            Sfat: pune o furculiță lângă farfurie pentru o estimare mai bună a porției.
          </p>
        </div>

        <div id="preview-card" class="preview-card hidden">
          <img id="preview-img" alt="Poza selectată" />
          <label class="field" for="notes-input">
            Notițe (opțional)
            <textarea
              id="notes-input"
              rows="2"
              placeholder="ex: shaorma doar cu carne și cartofi, sau gramaj ~300g"
            ></textarea>
          </label>
          <button id="analyze-btn" class="primary-btn">🔍 Analizează</button>
          <div id="analyze-status" class="status"></div>
          <div id="result" class="result hidden"></div>
          <div id="result-actions" class="result-actions hidden">
            <button id="save-btn" class="primary-btn">➕ Adaugă la ziua de azi</button>
            <button id="discard-btn" class="ghost-btn">Renunță</button>
          </div>
        </div>

        <div class="upload-card exercise-card">
          <button id="home-add-exercise" class="upload-btn">🏃 Adaugă un exercițiu</button>
          <p class="hint">
            Scrie ce ai făcut, ex: „am înotat 15 min, apoi cardio o oră".
          </p>
        </div>
      </section>

      <!-- ============ STATISTICI ============ -->
      <section id="view-stats" class="view">
        <!-- Datele personale -->
        <div class="profile-card">
          <h2>Datele mele</h2>
          <div class="profile-fields">
            <label class="field">
              Sex
              <select id="profile-sex">
                <option value="M">Bărbat</option>
                <option value="F">Femeie</option>
              </select>
            </label>
            <label class="field">
              Vârstă
              <input type="number" id="profile-age" min="1" max="120" inputmode="numeric" placeholder="ani" />
            </label>
            <label class="field">
              Înălțime
              <input type="number" id="profile-height" min="50" max="250" inputmode="numeric" placeholder="cm" />
            </label>
            <label class="field">
              Greutate
              <input type="number" id="profile-weight" min="20" max="400" step="0.1" inputmode="decimal" placeholder="kg" />
            </label>
          </div>
          <button id="profile-save" class="primary-btn">💾 Salvează</button>
          <div id="profile-status" class="status"></div>
          <div id="profile-summary" class="profile-summary"></div>
        </div>

        <!-- Selector de perioadă -->
        <div class="period-selector">
          <div id="period-modes" class="period-modes">
            <button class="period-mode active" data-mode="day">Zi</button>
            <button class="period-mode" data-mode="week">Săpt.</button>
            <button class="period-mode" data-mode="month">Lună</button>
            <button class="period-mode" data-mode="year">An</button>
            <button class="period-mode" data-mode="custom">Interval</button>
          </div>

          <!-- Navigare zi/săpt/lună/an -->
          <div id="period-nav" class="period-nav">
            <button id="period-prev" class="period-arrow" title="Înapoi">‹</button>
            <div id="period-label" class="period-label"></div>
            <button id="period-next" class="period-arrow" title="Înainte">›</button>
          </div>

          <!-- Interval ales manual -->
          <div id="period-range" class="period-range hidden">
            <label>De la <input type="date" id="range-start" /></label>
            <label>Până la <input type="date" id="range-end" /></label>
          </div>
        </div>

        <div class="add-row">
          <button id="add-manual-btn" class="add-manual-btn">➕ Adaugă o masă</button>
          <button id="add-exercise-btn" class="add-manual-btn">🏃 Adaugă exercițiu</button>
        </div>

        <div id="totals" class="totals"></div>
        <div id="entries" class="entries"></div>
      </section>
    </main>

    <!-- ============ Modal: adăugare manuală ============ -->
    <div id="manual-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Adaugă o masă</h2>
        <label for="manual-photo" class="upload-btn">📷 Alege o poză</label>
        <input id="manual-photo" type="file" accept="image/*" hidden />
        <img id="manual-preview" class="manual-preview hidden" alt="Poza aleasă" />
        <label class="field" for="manual-notes">
          Notițe (opțional)
          <textarea
            id="manual-notes"
            rows="2"
            placeholder="ex: shaorma cu de toate, sau gramaj ~300g"
          ></textarea>
        </label>
        <button id="manual-analyze" class="primary-btn" disabled>🔍 Analizează</button>
        <div id="manual-status" class="status"></div>
        <div id="manual-result" class="result hidden"></div>
        <label class="field" for="manual-datetime">
          Data și ora mesei
          <input type="datetime-local" id="manual-datetime" />
        </label>
        <div class="modal-actions">
          <button id="manual-save" class="primary-btn" disabled>Adaugă</button>
          <button id="manual-cancel" class="ghost-btn">Renunță</button>
        </div>
      </div>
    </div>

    <!-- ============ Modal: adaugă din nou o masă existentă ============ -->
    <div id="readd-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Adaugă din nou</h2>
        <div id="readd-summary" class="readd-summary"></div>
        <label class="field" for="readd-datetime">
          Data și ora mesei
          <input type="datetime-local" id="readd-datetime" />
        </label>
        <div id="readd-status" class="status"></div>
        <div class="modal-actions">
          <button id="readd-save" class="primary-btn">Adaugă</button>
          <button id="readd-cancel" class="ghost-btn">Renunță</button>
        </div>
      </div>
    </div>

    <!-- ============ Modal: adăugare exercițiu ============ -->
    <div id="exercise-modal" class="modal hidden">
      <div class="modal-card">
        <h2>Adaugă exercițiu</h2>
        <label class="field" for="exercise-text">
          Ce ai făcut?
          <textarea
            id="exercise-text"
            rows="3"
            placeholder="ex: am înotat 15 min, apoi m-am bălăcit 30 min, apoi cardio o oră la sală"
          ></textarea>
        </label>
        <button id="exercise-estimate" class="primary-btn">🔥 Estimează</button>
        <div id="exercise-status" class="status"></div>
        <div id="exercise-result" class="result hidden"></div>
        <label class="field" for="exercise-datetime">
          Data și ora
          <input type="datetime-local" id="exercise-datetime" />
        </label>
        <div class="modal-actions">
          <button id="exercise-save" class="primary-btn" disabled>Adaugă</button>
          <button id="exercise-cancel" class="ghost-btn">Renunță</button>
        </div>
      </div>
    </div>

    <!-- ============ Modal: detalii masă (macro + notițe) ============ -->
    <div id="meal-detail-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="meal-detail-title">Masă</h2>
        <div id="meal-detail-body" class="result"></div>
        <div class="modal-actions">
          <button id="meal-detail-close" class="primary-btn">Închide</button>
        </div>
      </div>
    </div>

    <!-- ============ Modal: detalii exercițiu (breakdown) ============ -->
    <div id="exercise-detail-modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="exercise-detail-title">Exercițiu</h2>
        <div id="exercise-detail-body" class="result"></div>
        <div class="modal-actions">
          <button id="exercise-detail-close" class="primary-btn">Închide</button>
        </div>
      </div>
    </div>

    <!-- ============ Lightbox: poză mărită ============ -->
    <div id="lightbox" class="lightbox hidden">
      <img id="lightbox-img" alt="Poză mărită" />
    </div>

    <script src="app.js"></script>
  </body>
</html>
